
name: Build UsahoDen v156 - Pengaturan Printer Manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Temurin 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and extract source ZIP v156
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 5 -type f \
            -iname 'UsahoDen-v156-Pengaturan-Printer-Manual-Source.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "Source ZIP v156 tidak ditemukan."
            find . -maxdepth 5 -type f -iname '*.zip' -print || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/usaho-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/usaho-source"

          PROJECT_DIR="$RUNNER_TEMP/usaho-source"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            PROJECT_DIR="$(find "$RUNNER_TEMP/usaho-source" -type f \
              \( -path '*/app/build.gradle' -o \
                 -path '*/app/build.gradle.kts' \) \
              -print -quit | sed -E 's#/app/build.gradle(\.kts)?$##')"
          fi

          if [ -z "$PROJECT_DIR" ] || \
             { [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
               [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; }; then
            echo "Gradle modul app tidak ditemukan."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "settings.gradle tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyek ditemukan: $PROJECT_DIR"

      - name: Install Android SDK command-line tools manually
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$RUNNER_TEMP/android-sdk"

          curl --fail --location --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o "$RUNNER_TEMP/android-tools.zip"

          mkdir -p "$RUNNER_TEMP/android-tools"
          unzip -q "$RUNNER_TEMP/android-tools.zip" \
            -d "$RUNNER_TEMP/android-tools"

          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          cp -a "$RUNNER_TEMP/android-tools/cmdline-tools/." \
            "$SDK_ROOT/cmdline-tools/latest/"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p "$ANDROID_HOME/licenses"

          for i in $(seq 1 20); do
            printf 'y\n'
          done > "$RUNNER_TEMP/sdk-licenses.txt"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses < "$RUNNER_TEMP/sdk-licenses.txt"

      - name: Install Android SDK packages - PATOKAN ABANG
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode existing signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ] || \
             [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_ALIAS:-}" ] || \
             [ -z "${KEY_PASSWORD:-}" ]; then
            echo "GitHub Secrets keystore lama belum lengkap."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/usahoden-existing.jks"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          {
            echo "TOKOKU_KEYSTORE_FILE=$KEYSTORE"
            echo "TOKOKU_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "TOKOKU_KEY_ALIAS=$KEY_ALIAS"
            echo "TOKOKU_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Verify version and build signed Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Memeriksa konfigurasi versi v156..."

          grep -Eq 'versionCode[[:space:]]+156' app/build.gradle
          grep -Fq \
            "3.22.16-v156-pengaturan-printer-manual" \
            app/build.gradle

          grep -Fq 'printerLogoMode' \
            app/src/main/assets/index.html

          grep -Fq 'final String compactText' \
            app/src/main/java/com/tokoku/app/MainActivity.java

          gradle --no-daemon assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$TOKOKU_KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$TOKOKU_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$TOKOKU_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$TOKOKU_KEY_PASSWORD"

      - name: Verify APK and prepare artifact
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "APK release tidak ditemukan."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose "$APK"

          mkdir -p output

          cp "$APK" \
            output/UsahoDen-v156-Pengaturan-Printer-Manual.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v156-Pengaturan-Printer-Manual
          path: output/UsahoDen-v156-Pengaturan-Printer-Manual.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/usahoden-existing.jks"
