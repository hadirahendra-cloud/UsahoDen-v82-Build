name: Build UsahoDen v83 Riwayat Pelanggan Header FIX

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "UsahoDen-v83-Riwayat-Pelanggan-Header-FIX-Source.zip"

permissions:
  contents: read

jobs:
  build:
    name: Build APK UsahoDen v83
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract and verify exact v83 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/UsahoDen-v83-Riwayat-Pelanggan-Header-FIX-Source.zip"

          test -s "$ZIP" || {
            echo "::error::ZIP sumber v83 tidak ditemukan di root repository."
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' -printf '%P\n' || true
            exit 1
          }

          unzip -tq "$ZIP"
          rm -rf extracted-source
          mkdir -p extracted-source
          unzip -oq "$ZIP" -d extracted-source

          PROJECT_DIR="$(find extracted-source -type f -path '*/app/build.gradle' -print -quit | sed 's#/app/build.gradle##')"

          test -n "$PROJECT_DIR" || {
            echo "::error::Proyek Android tidak ditemukan dalam ZIP."
            exit 1
          }

          cp -a "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/

          test -s app/build.gradle
          test -s app/src/main/assets/index.html
          test -s app/src/main/java/com/tokoku/app/MainActivity.java

          grep -q "applicationId 'com.tokoku.app'" app/build.gradle
          grep -q 'versionCode 83' app/build.gradle
          grep -q "versionName '3.22.15-riwayat-pelanggan-header-v83'" app/build.gradle
          grep -q 'v83: Riwayat pelanggan dimulai tepat di bawah header tetap' app/src/main/assets/index.html
          grep -q 'function saveSale()' app/src/main/assets/index.html
          grep -q 'function shareReceiptImage()' app/src/main/assets/index.html
          grep -q "localStorage.getItem('tokoku_db')" app/src/main/assets/index.html

          echo "Sumber v83 dan fitur penting terverifikasi."

      - name: Decode permanent signing key
        shell: bash
        env:
          TOKOKU_KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          TOKOKU_KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          TOKOKU_KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          TOKOKU_KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${TOKOKU_KEYSTORE_BASE64:-}" ] || \
             [ -z "${TOKOKU_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${TOKOKU_KEY_ALIAS:-}" ]; then
            echo "::error::Signing secrets belum lengkap. Build dihentikan agar APK tidak menggunakan kunci berbeda."
            exit 1
          fi

          printf '%s' "$TOKOKU_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/usaho-den-permanent.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/usaho-den-permanent.jks" \
            -storepass "$TOKOKU_KEYSTORE_PASSWORD" \
            -alias "$TOKOKU_KEY_ALIAS" >/dev/null

          {
            echo "TOKOKU_KEYSTORE_FILE=$RUNNER_TEMP/usaho-den-permanent.jks"
            echo "TOKOKU_KEYSTORE_PASSWORD=$TOKOKU_KEYSTORE_PASSWORD"
            echo "TOKOKU_KEY_ALIAS=$TOKOKU_KEY_ALIAS"
            echo "TOKOKU_KEY_PASSWORD=${TOKOKU_KEY_PASSWORD:-$TOKOKU_KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:clean :app:assembleRelease --no-daemon --stacktrace

          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || {
            echo "::error::APK release tidak berhasil dibuat."
            exit 1
          }

      - name: Verify APK signature, package, and version
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$TOOLS/apksigner" verify --verbose "$APK"

          "$TOOLS/aapt" dump badging "$APK" \
            | tee "$RUNNER_TEMP/badging.txt"

          grep -q "package: name='com.tokoku.app'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionCode='83'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='3.22.15-riwayat-pelanggan-header-v83'" "$RUNNER_TEMP/badging.txt"

          mkdir -p output
          cp "$APK" output/UsahoDen-v83-Riwayat-Pelanggan-Header-FIX.apk

          echo "APK v83 lolos pemeriksaan identitas."

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v83-Riwayat-Pelanggan-Header-FIX-Signed
          path: output/UsahoDen-v83-Riwayat-Pelanggan-Header-FIX.apk
          if-no-files-found: error
          retention-days: 30