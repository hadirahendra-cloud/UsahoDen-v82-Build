
name: Build UsahoDen v118 Tindakan Header Nav Fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'UsahoDen-v118-Tindakan-Header-Nav-Fix-Source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java Temurin 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager tidak ditemukan"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true
          set -o pipefail

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail
          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -O "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Extract v118 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/UsahoDen-v118-Tindakan-Header-Nav-Fix-Source.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP v118 tidak ditemukan di root repository"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/usaho-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/usaho-source"

          PROJECT_DIR="$(find "$RUNNER_TEMP/usaho-source" \
            -type f -path '*/app/build.gradle' \
            -print -quit | sed 's#/app/build.gradle$##')"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::app/build.gradle tidak ditemukan"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Decode existing signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${KEYSTORE_BASE64:-}" || {
            echo "::error::Secret keystore tidak tersedia"
            exit 1
          }

          test -n "${KEYSTORE_PASSWORD:-}" || {
            echo "::error::Password keystore tidak tersedia"
            exit 1
          }

          test -n "${KEY_ALIAS:-}" || {
            echo "::error::Alias keystore tidak tersedia"
            exit 1
          }

          KEYSTORE="$RUNNER_TEMP/usahoden-existing.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          {
            echo "TOKOKU_KEYSTORE_FILE=$KEYSTORE"
            echo "TOKOKU_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "TOKOKU_KEY_ALIAS=$KEY_ALIAS"
            echo "TOKOKU_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Verify v118 version
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          grep -Fq "applicationId 'com.tokoku.app'" app/build.gradle
          grep -Eq 'versionCode[[:space:]]+118' app/build.gradle
          grep -Fq \
            "versionName '3.22.15-v118-tindakan-header-nav-fix'" \
            app/build.gradle

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK and signature
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" > "$RUNNER_TEMP/apk-info.txt"

          grep -Fq "package: name='com.tokoku.app'" \
            "$RUNNER_TEMP/apk-info.txt"
          grep -Fq "versionCode='118'" \
            "$RUNNER_TEMP/apk-info.txt"

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" \
            "$GITHUB_WORKSPACE/output/UsahoDen-v118-Tindakan-Header-Nav-Fix.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v118-Tindakan-Header-Nav-Fix
          path: output/UsahoDen-v118-Tindakan-Header-Nav-Fix.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/usahoden-existing.jks"
