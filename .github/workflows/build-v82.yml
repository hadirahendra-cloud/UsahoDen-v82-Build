
name: Build UsahoDen v111 Tindakan Rapat - Stable SDK

on:
  workflow_dispatch:
  push:
    paths:
      - 'UsahoDen-v111-Tindakan-Rapat-Source.zip'
      - '.github/workflows/build-usahoden-v111-stable-sdk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java Temurin 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Gunakan SDK bawaan runner; jangan tambah setup-android.
      - name: Verify runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"

          command -v sdkmanager || true

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          elif ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::error::sdkmanager tidak ditemukan."
            find "$ANDROID_HOME" -name sdkmanager -type f -print || true
            exit 1
          fi

      # PATOKAN SDK ABANG - JANGAN UBAH
      - name: Accept licenses and install fixed SDK packages
        shell: bash
        run: |
          set -euo pipefail

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          mkdir -p "$ANDROID_HOME/licenses"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$SDKMANAGER" --list_installed

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/UsahoDen-v111-Tindakan-Rapat-Source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP v111 tidak ditemukan di root repository."
            find "$GITHUB_WORKSPACE" -maxdepth 4 \
              -type f -iname '*.zip' -print
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/source"

          PROJECT_DIR="$GITHUB_WORKSPACE/source"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] &&
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            SETTINGS_FILE="$(find "$PROJECT_DIR" -mindepth 2 -maxdepth 5 \
              -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit)"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "::error::settings.gradle tidak ditemukan dalam ZIP."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::File Gradle aplikasi tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version

          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          fi

          grep -q 'versionCode 111' "$BUILD_FILE" || {
            echo "::error::Source bukan versionCode 111."
            exit 1
          }

          grep -nE \
            'applicationId|versionCode|versionName|compileSdk' \
            "$BUILD_FILE"

      - name: Prepare existing signing key
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE_BASE64" ] &&
             [ -n "$KEYSTORE_PASSWORD" ] &&
             [ -n "$KEY_ALIAS" ]; then

            echo "$KEYSTORE_BASE64" |
              base64 --decode > "$RUNNER_TEMP/usaho-release.jks"

            keytool -list \
              -keystore "$RUNNER_TEMP/usaho-release.jks" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" >/dev/null

            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Keystore berhasil diverifikasi."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Keystore tidak lengkap; debug APK mungkin tidak bisa update APK lama."
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          TOKOKU_KEYSTORE_FILE: ${{ runner.temp }}/usaho-release.jks
          TOKOKU_KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          TOKOKU_KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          TOKOKU_KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease

      - name: Build debug APK
        if: steps.signing.outputs.enabled != 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleDebug

      - name: Verify and collect APK
        shell: bash
        env:
          SIGNED_RELEASE: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail

          if [ "$SIGNED_RELEASE" = "true" ]; then
            APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          else
            APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          fi

          if [ ! -s "$APK" ]; then
            echo "::error::APK hasil build tidak ditemukan."
            find "$PROJECT_DIR/app/build/outputs" \
              -type f -name '*.apk' -print || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/UsahoDen-v111.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose "$GITHUB_WORKSPACE/output/UsahoDen-v111.apk"

          sha256sum "$GITHUB_WORKSPACE/output/UsahoDen-v111.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v111-APK
          path: output/UsahoDen-v111.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/usaho-release.jks"
