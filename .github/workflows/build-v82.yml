
      - name: Fix posisi daftar pelanggan saja
        shell: bash
        run: |
          set -euo pipefail

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          python3 - "$HTML" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          html = path.read_text(encoding="utf-8")

          marker = "usahoden-customer-list-position-fix"

          # Hapus patch posisi dari build ini jika pernah ditambahkan.
          html = re.sub(
              r'<!-- ' + marker + r' -->.*?<!-- /' + marker + r' -->',
              '',
              html,
              flags=re.S
          )

          # Tambahkan jarak di awal konten, bukan mengubah ukuran header.
          css = """
          <!-- usahoden-customer-list-position-fix -->
          <style id="usahoden-customer-list-position-fix">
          main {
            padding-top: 18px !important;
          }

          #history {
            padding-top: 12px !important;
          }

          #history .history-customer:first-child {
            margin-top: 8px !important;
          }
          </style>
          <!-- /usahoden-customer-list-position-fix -->
          """

          if not re.search(r"</head\\s*>", html, re.I):
              raise SystemExit("ERROR: tag </head> tidak ditemukan.")

          html = re.sub(
              r"</head\\s*>",
              lambda m: css + "\n" + m.group(0),
              html,
              count=1,
              flags=re.I
          )

          path.write_text(html, encoding="utf-8")
          print("Jarak konten ditambahkan; CSS ukuran header tidak diubah.")
          PY
