
name: Build UsahoDen v111 Tindakan Rapat

on:
  workflow_dispatch:
  push:
    paths:
      - 'UsahoDen-v111-Tindakan-Rapat-Source.zip'
      - '.github/workflows/build-usahoden-v111.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java Temurin 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find and extract v111 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="UsahoDen-v111-Tindakan-Rapat-Source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP tidak ditemukan: $ZIP_FILE"
            echo "Pastikan ZIP diunggah ke root repository."
            find . -maxdepth 3 -type f -name '*.zip' -print
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/source"

          PROJECT_DIR="$GITHUB_WORKSPACE/source"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] &&
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::settings.gradle tidak ditemukan pada root ZIP."
            find "$PROJECT_DIR" -maxdepth 4 \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::File Gradle aplikasi tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Source v111 berhasil diekstrak."

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Java, Gradle and source version
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version

          grep -nE \
            'applicationId|versionCode|versionName|compileSdk' \
            "$PROJECT_DIR/app/build.gradle"

          grep -q "applicationId 'com.tokoku.app'" \
            "$PROJECT_DIR/app/build.gradle" || {
              echo "::error::Application ID tidak sesuai."
              exit 1
            }

          grep -q 'versionCode 111' \
            "$PROJECT_DIR/app/build.gradle" || {
              echo "::error::Version code bukan 111."
              exit 1
            }

      - name: Prepare signing keystore
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE_BASE64" ] &&
             [ -n "$KEYSTORE_PASSWORD" ] &&
             [ -n "$KEY_ALIAS" ]; then

            echo "$KEYSTORE_BASE64" | base64 --decode \
              > "$RUNNER_TEMP/usaho-release.jks"

            keytool -list \
              -keystore "$RUNNER_TEMP/usaho-release.jks" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" >/dev/null

            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Keystore berhasil diverifikasi."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Keystore tidak lengkap. APK debug akan dibuat; tanda tangannya mungkin berbeda dari APK lama."
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          TOKOKU_KEYSTORE_FILE: ${{ runner.temp }}/usaho-release.jks
          TOKOKU_KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          TOKOKU_KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          TOKOKU_KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease

      - name: Build debug APK
        if: steps.signing.outputs.enabled != 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleDebug

      - name: Verify and prepare APK
        id: apk
        shell: bash
        env:
          SIGNED_RELEASE: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail

          if [ "$SIGNED_RELEASE" = "true" ]; then
            APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          else
            APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          fi

          if [ ! -s "$APK" ]; then
            echo "::error::APK hasil build tidak ditemukan."
            find "$PROJECT_DIR/app/build/outputs" \
              -type f -name '*.apk' -print || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/UsahoDen-v111.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose \
              "$GITHUB_WORKSPACE/output/UsahoDen-v111.apk"
          else
            echo "::error::apksigner tidak ditemukan."
            exit 1
          fi

          sha256sum "$GITHUB_WORKSPACE/output/UsahoDen-v111.apk"

          echo "APK_PATH=output/UsahoDen-v111.apk" \
            >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v111-APK
          path: output/UsahoDen-v111.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup temporary keystore
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/usaho-release.jks"
