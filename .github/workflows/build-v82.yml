
name: Build UsahoDen v113 Produk Rapi

on:
  workflow_dispatch:
  push:
    paths:
      - 'UsahoDen-v113-Produk-Rapi-Tanpa-Kembali-Source.zip'
      - '.github/workflows/build-usahoden-v113.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java Temurin 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # PATOKAN SDK YANG SUDAH SUKSES - JANGAN UBAH
      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager tidak ditemukan."
            find /usr/local/lib/android /opt \
              -type f -name sdkmanager -print 2>/dev/null | head -20 || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          set +o pipefail
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true
          set -o pipefail

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-35"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -O "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" \
            -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Extract v113 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/UsahoDen-v113-Produk-Rapi-Tanpa-Kembali-Source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP v113 tidak ditemukan di root repository."
            find "$GITHUB_WORKSPACE" -maxdepth 4 \
              -type f -iname '*.zip' -print
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/usaho-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/usaho-source"

          SETTINGS_FILE="$(find "$RUNNER_TEMP/usaho-source" \
            -type f \( -name settings.gradle \
            -o -name settings.gradle.kts \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::app/build.gradle tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify app identity and version
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version

          grep -Fq "applicationId 'com.tokoku.app'" \
            "$PROJECT_DIR/app/build.gradle"

          grep -Eq 'versionCode[[:space:]]+113' \
            "$PROJECT_DIR/app/build.gradle"

          grep -Fq \
            "versionName '3.22.15-v113-products-layout-lock'" \
            "$PROJECT_DIR/app/build.gradle"

      - name: Decode existing signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ] ||
             [ -z "${KEYSTORE_PASSWORD:-}" ] ||
             [ -z "${KEY_ALIAS:-}" ]; then
            echo "::error::Secrets keystore lama belum lengkap."
            echo "Build dihentikan agar tanda tangan APK tidak berubah."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/usahoden-existing.jks"

          echo "$KEYSTORE_BASE64" |
            base64 --decode > "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          {
            echo "TOKOKU_KEYSTORE_FILE=$KEYSTORE"
            echo "TOKOKU_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "TOKOKU_KEY_ALIAS=$KEY_ALIAS"
            echo "TOKOKU_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and collect APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK release tidak ditemukan."
            find "$PROJECT_DIR/app/build/outputs" \
              -type f -name '*.apk' -print || true
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" | tee "$RUNNER_TEMP/apk-info.txt"

          grep -Fq "package: name='com.tokoku.app'" \
            "$RUNNER_TEMP/apk-info.txt"

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/UsahoDen-v113.apk"

          sha256sum "$GITHUB_WORKSPACE/output/UsahoDen-v113.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v113-APK
          path: output/UsahoDen-v113.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/usahoden-existing.jks"
