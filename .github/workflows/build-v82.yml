name: Build UsahoDen v83 Riwayat Scroll FIX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Jangan masukkan daftar paket ke setup-android.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses

      # Instal setiap paket secara terpisah.
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          "$ANDROID_HOME/platform-tools/adb" version
          echo "Android SDK siap."

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail
          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -O "$RUNNER_TEMP/gradle-8.7.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.7.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 5 -type f \
            -iname 'UsahoDen-v83-Riwayat-Scroll-Source.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::ZIP source v83 tidak ditemukan."
            echo "ZIP yang ada di repository:"
            find . -maxdepth 5 -type f -iname '*.zip' -print || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/usaho-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/usaho-source"

          PROJECT_DIR="$(find "$RUNNER_TEMP/usaho-source" \
            -type f \( -path '*/app/build.gradle' \
            -o -path '*/app/build.gradle.kts' \) \
            -print -quit | sed -E 's#/app/build\.gradle(\.kts)?$##')"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::File Gradle aplikasi tidak ditemukan di dalam ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Source ditemukan."

      - name: Check app source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -s app/src/main/assets/index.html
          test -f app/build.gradle || test -f app/build.gradle.kts

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --version
          else
            gradle --version
          fi

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      # Gunakan keystore lama agar APK dapat memperbarui aplikasi lama.
      - name: Sign APK with permanent keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ] || \
             [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_ALIAS:-}" ]; then
            echo "::error::Secrets keystore lama belum lengkap."
            echo "APK tidak akan ditandatangani dengan kunci baru."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/usaho-den.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          mkdir -p output
          cp "$APK" output/UsahoDen-v83-unsigned.apk

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -f -p 4 \
            output/UsahoDen-v83-unsigned.apk \
            output/UsahoDen-v83-aligned.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass "env:KEY_PASSWORD" \
            --out output/UsahoDen-v83-Riwayat-Scroll-FIX-Signed.apk \
            output/UsahoDen-v83-aligned.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose output/UsahoDen-v83-Riwayat-Scroll-FIX-Signed.apk

      - name: Check APK package identity
        shell: bash
        run: |
          set -euo pipefail

          APK="output/UsahoDen-v83-Riwayat-Scroll-FIX-Signed.apk"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
            | tee "$RUNNER_TEMP/apk-info.txt"

          grep -Fq "package: name='com.tokoku.app'" \
            "$RUNNER_TEMP/apk-info.txt"

          echo "Nama paket terverifikasi."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v83-Riwayat-Scroll-FIX-Signed
          path: output/UsahoDen-v83-Riwayat-Scroll-FIX-Signed.apk
          if-no-files-found: error
          retention-days: 30