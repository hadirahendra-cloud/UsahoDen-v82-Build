
name: Build UsahoDen v82 - FIX Android SDK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.yml'
      - '**.yaml'
      - '*.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Tidak menggunakan android-actions/setup-android@v3.
      # Gunakan SDK bawaan runner dan jangan meminta paket "tools".
      - name: Setup Android SDK - Runner Bawaan
        shell: bash
        run: |
          set -e

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          else
            echo "::error::Android SDK bawaan runner tidak ditemukan."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "SDK ditemukan: $SDK"

          SDKMANAGER=""
          for candidate in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK/cmdline-tools/15.0/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" \
              -type f -path '*/bin/sdkmanager' 2>/dev/null \
              | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager tidak ditemukan di SDK bawaan."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "SDK manager: $SDKMANAGER"

          # Periksa apakah komponen yang dibutuhkan sudah tersedia.
          if [ -d "$SDK/platforms/android-35" ] && \
             [ -x "$SDK/build-tools/35.0.0/apksigner" ] && \
             [ -x "$SDK/build-tools/35.0.0/zipalign" ]; then
            echo "Platform Android 35 dan Build Tools 35.0.0 tersedia."
          else
            echo "Komponen SDK yang diperlukan belum lengkap."
            "$SDKMANAGER" --sdk_root="$SDK" --licenses < /dev/null || true
            yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses \
              >/dev/null 2>&1 || true

            "$SDKMANAGER" --sdk_root="$SDK" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"
          fi

          test -d "$SDK/platforms/android-35"
          test -x "$SDK/build-tools/35.0.0/apksigner"
          test -x "$SDK/build-tools/35.0.0/zipalign"

          echo "Android SDK siap digunakan."

      - name: Find and extract UsahoDen source ZIP
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 1 -type f \
            -iname 'UsahoDen*.zip' -printf '%T@ %p\n' \
            | sort -nr | head -n 1 | cut -d ' ' -f 2-)"

          if [ -z "$ZIP" ]; then
            ZIP="$(find . -maxdepth 1 -type f \
              -iname '*.zip' -printf '%T@ %p\n' \
              | sort -nr | head -n 1 | cut -d ' ' -f 2-)"
          fi

          if [ -z "$ZIP" ]; then
            echo "::error::ZIP sumber UsahoDen tidak ditemukan di root repository."
            exit 1
          fi

          echo "ZIP sumber: $ZIP"
          mkdir -p "$GITHUB_WORKSPACE/usaho-source"
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/usaho-source"

          PROJECT=""
          while IFS= read -r file; do
            dir="$(dirname "$file")"
            if [ -f "$dir/app/build.gradle" ] || \
               [ -f "$dir/app/build.gradle.kts" ]; then
              PROJECT="$dir"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE/usaho-source" \
              -type f \( -name settings.gradle \
              -o -name settings.gradle.kts \) | sort
          )

          if [ -z "$PROJECT" ]; then
            while IFS= read -r file; do
              dir="$(dirname "$file")"
              if [ -f "$dir/build.gradle" ] || \
                 [ -f "$dir/build.gradle.kts" ]; then
                PROJECT="$dir"
                break
              fi
            done < <(
              find "$GITHUB_WORKSPACE/usaho-source" \
                -type f \( -path '*/app/build.gradle' \
                -o -path '*/app/build.gradle.kts' \) | sort
            )
          fi

          if [ -z "$PROJECT" ]; then
            echo "::error::Folder proyek Android tidak ditemukan di ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Proyek Android ditemukan: $PROJECT"

      - name: Verify permanent keystore and secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -e

          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD \
                      KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name belum tersedia."
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/usaho-release.jks"

          test -s "$RUNNER_TEMP/usaho-release.jks"

          echo "KEYSTORE_FILE=$RUNNER_TEMP/usaho-release.jks" \
            >> "$GITHUB_ENV"

          echo "Keystore ditemukan dan hasil decode tidak kosong."

      - name: Build Release APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:clean :app:assembleRelease \
              --no-daemon --stacktrace
          else
            gradle :app:clean :app:assembleRelease \
              --no-daemon --stacktrace
          fi

      - name: Sign and verify APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -e

          SDK="$ANDROID_HOME"
          TOOLS="$SDK/build-tools/35.0.0"
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"

          APK="$(find "$APK_DIR" -maxdepth 1 -type f \
            -name '*.apk' -printf '%T@ %p\n' \
            | sort -nr | head -n 1 | cut -d ' ' -f 2-)"

          if [ -z "$APK" ]; then
            echo "::error::APK release tidak dihasilkan oleh Gradle."
            exit 1
          fi

          echo "APK hasil build: $APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          "$TOOLS/zipalign" -f -p 4 \
            "$APK" "$RUNNER_TEMP/usaho-aligned.apk"

          "$TOOLS/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$GITHUB_WORKSPACE/apk-output/UsahoDen.apk" \
            "$RUNNER_TEMP/usaho-aligned.apk"

          "$TOOLS/apksigner" verify --verbose --print-certs \
            "$GITHUB_WORKSPACE/apk-output/UsahoDen.apk"

          test -s "$GITHUB_WORKSPACE/apk-output/UsahoDen.apk"
          echo "APK berhasil ditandatangani dan diverifikasi."

      - name: Upload UsahoDen APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-APK
          path: apk-output/UsahoDen.apk
          if-no-files-found: error
          retention-days: 14
