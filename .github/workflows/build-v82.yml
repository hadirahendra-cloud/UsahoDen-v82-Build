
name: Build UsahoDen v112 Tindakan Rapat SDK FIX

on:
  workflow_dispatch:
  push:
    paths:
      - 'UsahoDen-v112-Tindakan-Rapat-SDK-FIX-Source.zip'
      - '.github/workflows/build-usahoden-v112.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java Temurin 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK
        shell: bash
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/licenses"

          set +o pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          set -o pipefail

          sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/UsahoDen-v112-Tindakan-Rapat-SDK-FIX-Source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP v112 tidak ditemukan di root repository."
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip'
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/source"

          PROJECT_DIR="$GITHUB_WORKSPACE/source"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] &&
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::settings.gradle tidak ditemukan."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Gradle aplikasi tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version

          grep -q 'versionCode 112' "$PROJECT_DIR/app/build.gradle" || {
            echo "::error::Version code bukan 112."
            exit 1
          }

          grep -nE \
            'applicationId|versionCode|versionName|compileSdk' \
            "$PROJECT_DIR/app/build.gradle"

      - name: Prepare existing signing key
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE_BASE64" ] &&
             [ -n "$KEYSTORE_PASSWORD" ] &&
             [ -n "$KEY_ALIAS" ]; then

            echo "$KEYSTORE_BASE64" |
              base64 --decode > "$RUNNER_TEMP/usaho-release.jks"

            keytool -list \
              -keystore "$RUNNER_TEMP/usaho-release.jks" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" >/dev/null

            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Keystore belum lengkap; build debug tidak dijamin kompatibel untuk update APK lama."
          fi

      - name: Build release APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          TOKOKU_KEYSTORE_FILE: ${{ runner.temp }}/usaho-release.jks
          TOKOKU_KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          TOKOKU_KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          TOKOKU_KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease

      - name: Build debug APK
        if: steps.signing.outputs.enabled != 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleDebug

      - name: Verify and collect APK
        shell: bash
        env:
          SIGNED_RELEASE: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail

          if [ "$SIGNED_RELEASE" = "true" ]; then
            APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          else
            APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          fi

          if [ ! -s "$APK" ]; then
            echo "::error::APK tidak ditemukan."
            find "$PROJECT_DIR/app/build/outputs" \
              -type f -name '*.apk' -print || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/UsahoDen-v112.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose "$GITHUB_WORKSPACE/output/UsahoDen-v112.apk"

          sha256sum "$GITHUB_WORKSPACE/output/UsahoDen-v112.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v112-APK
          path: output/UsahoDen-v112.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/usaho-release.jks"
