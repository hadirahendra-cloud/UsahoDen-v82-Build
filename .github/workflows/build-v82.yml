name: Build UsahoDen v82 FIX

on:
  workflow_dispatch:
  push:
    paths:
      - "UsahoDen-v82-Riwayat-Sticky-Compact-Source.zip"
      - ".github/workflows/build-v82.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build and Sign UsahoDen v82
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          echo "Android SDK siap."

      - name: Prepare permanent keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
        run: |
          set -e
          KEYSTORE="signing/usaho-den-v61-permanent.jks"

          if [ ! -f "$KEYSTORE" ]; then
            echo "::error::Keystore permanen tidak ditemukan: $KEYSTORE"
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret TOKOKU_KEYSTORE_PASSWORD belum diisi."
            exit 1
          fi

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD"

          echo "Keystore berhasil diverifikasi."

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e
          ZIP="UsahoDen-v82-Riwayat-Sticky-Compact-Source.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP sumber tidak ditemukan: $ZIP"
            echo "Pastikan ZIP berada di folder utama repository."
            find . -maxdepth 3 -type f -name "*.zip"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/source"

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/source" \
            -type f -path "*/app/build.gradle" \
            -print -quit | xargs -r dirname | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Folder proyek Android tidak ditemukan di ZIP."
            find "$GITHUB_WORKSPACE/source" -maxdepth 5 -type f \
              \( -name "build.gradle" -o -name "settings.gradle" \)
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyek ditemukan: $PROJECT_DIR"

      - name: Build release APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean assembleRelease
          else
            gradle --no-daemon clean assembleRelease
          fi

      - name: Check APK
        shell: bash
        run: |
          set -e
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f -name "*.apk" -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK release tidak ditemukan."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/UsahoDen-v82-unsigned.apk"
          echo "APK hasil build ditemukan."

      - name: Sign release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: usahoden
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Secret TOKOKU_KEY_PASSWORD belum diisi."
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          KEYSTORE="$GITHUB_WORKSPACE/signing/usaho-den-v61-permanent.jks"
          INPUT="$GITHUB_WORKSPACE/output/UsahoDen-v82-unsigned.apk"
          ALIGNED="$GITHUB_WORKSPACE/output/UsahoDen-v82-aligned.apk"
          OUTPUT="$GITHUB_WORKSPACE/output/UsahoDen-v82.apk"

          "$BUILD_TOOLS/zipalign" -f -v 4 "$INPUT" "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$OUTPUT" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose "$OUTPUT"

      - name: Verify application ID
        shell: bash
        run: |
          set -e
          APK="$GITHUB_WORKSPACE/output/UsahoDen-v82.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          "$AAPT" dump badging "$APK" | grep -F \
            "package: name='com.tokoku.app'"

          echo "Application ID cocok untuk pembaruan aplikasi."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v82-APK
          path: output/UsahoDen-v82.apk
          if-no-files-found: error
          retention-days: 14