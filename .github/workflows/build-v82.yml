
name: Build UsahoDen v82 - Login Tap Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v82.yml'
      - '*.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          if [ ! -x "$SDK/build-tools/35.0.0/apksigner" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" \
              -type f -path '*/bin/sdkmanager' \
              -print -quit 2>/dev/null || true)"

            if [ -z "$SDKMANAGER" ]; then
              echo "::error::sdkmanager tidak ditemukan."
              exit 1
            fi

            yes | "$SDKMANAGER" \
              --sdk_root="$SDK" --licenses \
              >/dev/null 2>&1 || true

            "$SDKMANAGER" --sdk_root="$SDK" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"
          fi

          test -d "$SDK/platforms/android-35"
          test -x "$SDK/build-tools/35.0.0/zipalign"
          test -x "$SDK/build-tools/35.0.0/apksigner"

      - name: Extract fixed login source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="UsahoDen-v82-Login-Tap-Fix-Source.zip"

          echo "Daftar ZIP di repository:"
          find . -maxdepth 2 -type f -name '*.zip' -print

          if [ ! -f "$ZIP" ]; then
            echo "::error::File $ZIP belum ada di root repository."
            echo "Upload ZIP ke folder utama GitHub terlebih dahulu."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/usaho-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/usaho-source"

          PROJECT=""

          while IFS= read -r file; do
            dir="$(dirname "$file")"
            if [ -f "$dir/app/build.gradle" ] || \
               [ -f "$dir/app/build.gradle.kts" ]; then
              PROJECT="$dir"
              break
            fi
          done < <(
            find "$RUNNER_TEMP/usaho-source" \
              -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \) | sort
          )

          if [ -z "$PROJECT" ]; then
            echo "::error::Proyek Android tidak ditemukan."
            exit 1
          fi

          HTML="$PROJECT/app/src/main/assets/index.html"

          if [ ! -f "$HTML" ]; then
            echo "::error::index.html tidak ditemukan."
            exit 1
          fi

          grep -q 'loginSubmitButton' "$HTML" || {
            echo "::error::Perbaikan tombol login tidak ditemukan."
            exit 1
          }

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Sumber login fix ditemukan."

      - name: Verify permanent keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD \
                      KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name belum tersedia."
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/usaho-release.jks"

          test -s "$RUNNER_TEMP/usaho-release.jks"

          echo "KEYSTORE_FILE=$RUNNER_TEMP/usaho-release.jks" \
            >> "$GITHUB_ENV"

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:clean :app:assembleRelease \
              --no-daemon --stacktrace
          else
            gradle :app:clean :app:assembleRelease \
              --no-daemon --stacktrace
          fi

      - name: Sign and verify APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"

          APK="$(find "$APK_DIR" -maxdepth 1 -type f \
            -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK release tidak ditemukan."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          "$TOOLS/zipalign" -f -p 4 \
            "$APK" "$RUNNER_TEMP/usaho-aligned.apk"

          "$TOOLS/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$GITHUB_WORKSPACE/apk-output/UsahoDen.apk" \
            "$RUNNER_TEMP/usaho-aligned.apk"

          "$TOOLS/apksigner" verify \
            --verbose --print-certs \
            "$GITHUB_WORKSPACE/apk-output/UsahoDen.apk"

          test -s "$GITHUB_WORKSPACE/apk-output/UsahoDen.apk"

      - name: Upload UsahoDen APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-Login-Tap-Fix
          path: apk-output/UsahoDen.apk
          if-no-files-found: error
          retention-days: 14
