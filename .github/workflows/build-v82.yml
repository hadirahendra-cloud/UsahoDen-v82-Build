name: Build UsahoDen v83 Riwayat Scroll FIX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Tidak menggunakan setup-android@v3,
      # karena action tersebut memicu pencarian paket "tools".
      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager tidak ditemukan di Android SDK."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "SDKMANAGER_DIR=$(dirname "$SDKMANAGER")" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools"

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-35"

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

          adb version
          echo "Android SDK siap digunakan."

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -O "$RUNNER_TEMP/gradle-8.7.zip"

          unzip -q "$RUNNER_TEMP/gradle-8.7.zip" \
            -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/gradle-8.7/bin/gradle" --version

      - name: Find and extract UsahoDen v83 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 5 -type f \
            -iname 'UsahoDen-v83-Riwayat-Scroll-Source.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::ZIP source v83 tidak ditemukan."
            echo "Unggah ZIP source ke repository GitHub terlebih dahulu."
            find . -maxdepth 5 -type f -iname '*.zip' -print || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/usaho-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/usaho-source"

          PROJECT_DIR="$(find "$RUNNER_TEMP/usaho-source" \
            -type f \( \
              -path '*/app/build.gradle' -o \
              -path '*/app/build.gradle.kts' \
            \) -print -quit | sed -E \
            's#/app/build\.gradle(\.kts)?$##')"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Project Android tidak ditemukan di ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Source ditemukan."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Check APK output
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK debug tidak ditemukan."
            find "$PROJECT_DIR/app/build/outputs" \
              -type f -name '*.apk' -print || true
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/UsahoDen-v83-debug-unsigned.apk

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" \
            | tee "$RUNNER_TEMP/apk-info.txt"

      - name: Sign APK with existing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ] || \
             [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_ALIAS:-}" ]; then
            echo "::error::Secrets keystore lama belum lengkap."
            echo "APK unsigned tetap disediakan sebagai artifact."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/usahoden-existing.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -f -p 4 "$APK" output/UsahoDen-v83-aligned.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out output/UsahoDen-v83-Riwayat-Scroll-FIX-Signed.apk \
            output/UsahoDen-v83-aligned.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose output/UsahoDen-v83-Riwayat-Scroll-FIX-Signed.apk

      - name: Verify signed APK identity
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="output/UsahoDen-v83-Riwayat-Scroll-FIX-Signed.apk"

          if [ -s "$APK" ]; then
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
              dump badging "$APK" \
              | tee "$RUNNER_TEMP/signed-info.txt"

            grep -Fq "package: name='com.tokoku.app'" \
              "$RUNNER_TEMP/signed-info.txt"
          fi

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v83-Build-Results
          path: output/*.apk
          if-no-files-found: warn
          retention-days: 30