
name: Build UsahoDen v153 - Fix Login Penjualan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Temurin 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and extract source ZIP v153 FIX LOGIN
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 5 -type f \
            -iname '*UsahoDen-v153-Penjualan-Kembali-Kanan-Source-FIX-Login.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "Source ZIP v153 FIX LOGIN tidak ditemukan."
            echo "Unggah ZIP perbaikan login ke repository."
            exit 1
          fi

          mkdir -p tokoku-project
          unzip -q "$ZIP_FILE" -d tokoku-project

          PROJECT_DIR="$(find tokoku-project -type f \
            \( -path '*/app/build.gradle' -o \
               -path '*/app/build.gradle.kts' \) \
            -printf '%h\n' -quit | sed 's#/app$##')"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle modul app tidak ditemukan."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "settings.gradle tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyek ditemukan: $PROJECT_DIR"

      - name: Install Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$RUNNER_TEMP/android-tools"

          curl --fail --location --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o "$RUNNER_TEMP/android-tools.zip"

          unzip -q "$RUNNER_TEMP/android-tools.zip" \
            -d "$RUNNER_TEMP/android-tools"

          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          cp -a "$RUNNER_TEMP/android-tools/cmdline-tools/." \
            "$SDK_ROOT/cmdline-tools/latest/"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept SDK licenses and install packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          set +e
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses
          SDK_STATUS=${PIPESTATUS[1]}
          set -e

          if [ "$SDK_STATUS" -ne 0 ]; then
            echo "Penerimaan lisensi SDK gagal."
            exit 1
          fi

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode existing signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret TOKOKU_KEYSTORE_BASE64 belum tersedia."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/usahoden-release.jks"

          test -s "$RUNNER_TEMP/usahoden-release.jks"

      - name: Build Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ] || \
             [ -z "$KEY_PASSWORD" ]; then
            echo "GitHub Secrets penandatanganan belum lengkap."
            exit 1
          fi

          cd "$PROJECT_DIR"

          gradle --version

          gradle --no-daemon assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/usahoden-release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "APK release tidak ditemukan."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose "$APK"

          mkdir -p output
          cp "$APK" output/UsahoDen-v153-FIX-Login-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v153-FIX-Login
          path: output/UsahoDen-v153-FIX-Login-release.apk
          if-no-files-found: error
