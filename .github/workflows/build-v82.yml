
name: Build UsahoDen APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Temurin 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses || true
          sdkmanager --licenses </dev/null || true

      - name: Install Android SDK Packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate and Extract Source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="UsahoDen-v3.22.15-Source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f \
              -iname 'UsahoDen*.zip' \
              ! -path './.git/*' \
              | head -n 1)"
          fi

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP UsahoDen tidak ditemukan."
            echo "Upload ZIP sumber aplikasi ke repository."
            exit 1
          fi

          echo "Source ZIP: $ZIP_FILE"
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          GRADLE_FILE="$(find source -type f \
            -name gradlew -print -quit)"

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: gradlew tidak ditemukan dalam ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLE_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project ditemukan: $PROJECT_DIR"

      - name: Verify Application Identity
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -f settings.gradle ] &&
             [ ! -f settings.gradle.kts ]; then
            echo "ERROR: File konfigurasi Gradle tidak ditemukan."
            exit 1
          fi

          echo "Identitas aplikasi yang dipertahankan:"
          echo "Package: com.tokoku.app"
          echo "Nama aplikasi: UsahoDen"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew --no-daemon assembleDebug

      - name: Decode Existing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Secret TOKOKU_KEYSTORE_BASE64 kosong."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/usaho.keystore"

          test -s "$RUNNER_TEMP/usaho.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/usaho.keystore" \
            >> "$GITHUB_ENV"

      - name: Sign APK with Existing Key
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -e

          APK="$(find . -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK hasil build tidak ditemukan."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ] ||
             [ -z "$KEYSTORE_PASSWORD" ] ||
             [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Secret signing belum lengkap."
            exit 1
          fi

          cp "$APK" "$RUNNER_TEMP/UsahoDen-unsigned.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$GITHUB_WORKSPACE/UsahoDen.apk" \
            "$RUNNER_TEMP/UsahoDen-unsigned.apk"

          "$APKSIGNER" verify --verbose \
            "$GITHUB_WORKSPACE/UsahoDen.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-APK
          path: UsahoDen.apk
          if-no-files-found: error
          retention-days: 14
