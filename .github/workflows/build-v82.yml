
name: Build UsahoDen v127 Bar Bawah Kembali

on:
  workflow_dispatch:
  push:
    paths:
      - 'UsahoDen-v127-Bar-Bawah-Kembali-Source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Temurin 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate SDK Manager
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::SDK Manager tidak ditemukan."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          set -o pipefail

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -O "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" \
            -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Extract v127 Source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 5 -type f \
            -name 'UsahoDen-v127-Bar-Bawah-Kembali-Source.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::ZIP source v127 tidak ditemukan."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/usaho-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/usaho-source"

          PROJECT_DIR="$(find "$RUNNER_TEMP/usaho-source" \
            -type f -path '*/app/build.gradle' \
            -print -quit | sed 's#/app/build.gradle$##')"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::app/build.gradle tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Version and CSS
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          grep -Fq "applicationId 'com.tokoku.app'" \
            app/build.gradle

          grep -Eq 'versionCode[[:space:]]+127' \
            app/build.gradle

          grep -Fq \
            "versionName '3.22.15-v127-bar-bawah-kembali'" \
            app/build.gradle

          grep -Fq \
            '#receiptModal .sheet{padding-top:100px!important;box-sizing:border-box!important}' \
            app/src/main/assets/index.html

          grep -Fq \
            'body:has(#receiptModal.show) .nav{z-index:15!important}' \
            app/src/main/assets/index.html

          grep -Fq \
            '#receiptModal .sheet{padding-bottom:calc(90px + env(safe-area-inset-bottom))!important}' \
            app/src/main/assets/index.html

          echo "Versi dan aturan CSS v127 terverifikasi."

      - name: Decode Existing Signing Key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ] || \
             [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_ALIAS:-}" ]; then
            echo "::error::Secrets keystore lama belum lengkap."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/usahoden-existing.jks"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          {
            echo "TOKOKU_KEYSTORE_FILE=$KEYSTORE"
            echo "TOKOKU_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "TOKOKU_KEY_ALIAS=$KEY_ALIAS"
            echo "TOKOKU_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK release tidak ditemukan."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" | tee "$RUNNER_TEMP/apk-info.txt"

          grep -Fq "package: name='com.tokoku.app'" \
            "$RUNNER_TEMP/apk-info.txt"

          grep -Fq "versionCode='127'" \
            "$RUNNER_TEMP/apk-info.txt"

          grep -Fq \
            "versionName='3.22.15-v127-bar-bawah-kembali'" \
            "$RUNNER_TEMP/apk-info.txt"

      - name: Prepare APK Artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp \
            "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" \
            "$GITHUB_WORKSPACE/output/UsahoDen-v127-Bar-Bawah-Kembali.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v127-Bar-Bawah-Kembali-APK
          path: output/UsahoDen-v127-Bar-Bawah-Kembali.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup Signing Key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/usahoden-existing.jks"
