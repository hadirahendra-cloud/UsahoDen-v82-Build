name: Build UsahoDen v83 Riwayat Scroll FIX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find and extract UsahoDen v83 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 3 -type f -iname 'UsahoDen-v83-Riwayat-Scroll-Source.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::File UsahoDen-v83-Riwayat-Scroll-Source.zip tidak ditemukan di repository."
            echo "ZIP yang ditemukan:"
            find . -maxdepth 3 -type f -iname '*.zip' -print || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/usaho-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/usaho-source"

          PROJECT_DIR="$(find "$RUNNER_TEMP/usaho-source" -type f -path '*/app/build.gradle' -print -quit | sed 's#/app/build.gradle$##')"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::app/build.gradle tidak ditemukan di dalam ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Decode permanent signing key
        shell: bash
        env:
          TOKOKU_KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          TOKOKU_KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          TOKOKU_KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          TOKOKU_KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${TOKOKU_KEYSTORE_BASE64:-}" ] || \
             [ -z "${TOKOKU_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${TOKOKU_KEY_ALIAS:-}" ]; then
            echo "::error::Signing secrets belum lengkap. Build dihentikan agar APK tidak memakai tanda tangan berbeda."
            exit 1
          fi

          echo "$TOKOKU_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/usaho-den-permanent.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/usaho-den-permanent.jks" \
            -storepass "$TOKOKU_KEYSTORE_PASSWORD" \
            -alias "$TOKOKU_KEY_ALIAS" >/dev/null

          echo "TOKOKU_KEYSTORE_FILE=$RUNNER_TEMP/usaho-den-permanent.jks" >> "$GITHUB_ENV"
          echo "TOKOKU_KEYSTORE_PASSWORD=$TOKOKU_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "TOKOKU_KEY_ALIAS=$TOKOKU_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "TOKOKU_KEY_PASSWORD=${TOKOKU_KEY_PASSWORD:-$TOKOKU_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"

      - name: Verify app identity and preserved features
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          grep -q "applicationId 'com.tokoku.app'" app/build.gradle
          grep -q 'versionCode 83' app/build.gradle
          grep -q "localStorage.getItem('tokoku_db')" app/src/main/assets/index.html
          grep -q 'function saveSale()' app/src/main/assets/index.html
          grep -q 'function shareReceiptImage()' app/src/main/assets/index.html
          grep -q 'function renderCart()' app/src/main/assets/index.html
          grep -q '#historyList' app/src/main/assets/index.html
          test -s app/src/main/java/com/tokoku/app/MainActivity.java

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signed APK and copy output
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
            | tee "$RUNNER_TEMP/badging.txt"

          grep -q "package: name='com.tokoku.app'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionCode='83'" "$RUNNER_TEMP/badging.txt"

          mkdir -p output
          cp "$APK" output/UsahoDen-v83-Riwayat-Scroll-FIX-Signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v83-Riwayat-Scroll-FIX-Signed
          path: output/UsahoDen-v83-Riwayat-Scroll-FIX-Signed.apk
          if-no-files-found: error
          retention-days: 30