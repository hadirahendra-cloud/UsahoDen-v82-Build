name: Build UsahoDen v101 Header Compact

on:
  workflow_dispatch:
  push:
    paths:
      - "UsahoDen-v101-Header-Compact-Login-Preserved-Source.zip"
      - ".github/workflows/build-usahoden-v101.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Temurin 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --licenses

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find and Extract Source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 3 -type f \
            -name 'UsahoDen-v101-Header-Compact-Login-Preserved-Source.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP source v101 tidak ditemukan."
            echo "Upload ZIP v101 ke repository GitHub terlebih dahulu."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/source"

          PROJECT="$GITHUB_WORKSPACE/source"

          if [ ! -f "$PROJECT/app/build.gradle" ]; then
            FOUND="$(find "$PROJECT" -mindepth 2 -maxdepth 5 \
              -path '*/app/build.gradle' -print -quit)"

            if [ -z "$FOUND" ]; then
              echo "ERROR: app/build.gradle tidak ditemukan."
              exit 1
            fi

            PROJECT="$(dirname "$(dirname "$FOUND")")"
          fi

          if [ ! -f "$PROJECT/settings.gradle" ] && \
             [ ! -f "$PROJECT/settings.gradle.kts" ]; then
            echo "ERROR: File settings.gradle tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

          echo "Source ditemukan:"
          echo "$PROJECT"

      - name: Verify App Identity and Version
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          grep -Fq "applicationId 'com.tokoku.app'" app/build.gradle
          grep -Eq 'versionCode[[:space:]]+101' app/build.gradle

          echo "Package: com.tokoku.app"
          echo "VersionCode: 101"
          echo "Identitas aplikasi berhasil diperiksa."

      - name: Prepare Existing Signing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ] || \
             [ -z "$KEYSTORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: GitHub Secrets keystore belum lengkap."
            echo "Build dihentikan agar tidak menghasilkan APK"
            echo "yang tidak bisa memperbarui aplikasi lama."
            exit 1
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/usahoden-release.jks"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: File keystore kosong atau gagal di-decode."
            exit 1
          fi

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "TOKOKU_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "TOKOKU_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "TOKOKU_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

          if [ -n "$KEY_PASSWORD" ]; then
            echo "TOKOKU_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "TOKOKU_KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          fi

          echo "Keystore berhasil diperiksa."

      - name: Build Signed Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleRelease --no-daemon
          else
            gradle :app:assembleRelease --no-daemon
          fi

      - name: Verify and Copy APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APK="$(find app/build/outputs/apk/release \
            -maxdepth 1 -type f -name '*.apk' \
            ! -name '*unsigned*' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK Release tidak ditemukan."
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify --verbose "$APK"

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" \
            "$GITHUB_WORKSPACE/output/UsahoDen-v101-Header-Compact.apk"

          echo "APK berhasil dibuat dan tanda tangan terverifikasi."
          ls -lh "$GITHUB_WORKSPACE/output/UsahoDen-v101-Header-Compact.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v101-Header-Compact-APK
          path: output/UsahoDen-v101-Header-Compact.apk
          if-no-files-found: error
          retention-days: 14