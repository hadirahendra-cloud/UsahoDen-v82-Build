
name: Build UsahoDen v82 - FIX Posisi Daftar Pelanggan

on:
  workflow_dispatch:
  push:
    paths:
      - '**.yml'
      - '**.yaml'
      - '*.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK tidak ditemukan."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=""
          for candidate in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK/cmdline-tools/15.0/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" \
              -type f -path '*/bin/sdkmanager' \
              -print -quit 2>/dev/null || true)"
          fi

          if [ ! -d "$SDK/platforms/android-35" ] || \
             [ ! -x "$SDK/build-tools/35.0.0/apksigner" ] || \
             [ ! -x "$SDK/build-tools/35.0.0/zipalign" ]; then

            if [ -z "$SDKMANAGER" ]; then
              echo "::error::sdkmanager tidak ditemukan."
              exit 1
            fi

            yes | "$SDKMANAGER" \
              --sdk_root="$SDK" --licenses \
              >/dev/null 2>&1 || true

            "$SDKMANAGER" --sdk_root="$SDK" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"
          fi

          test -d "$SDK/platforms/android-35"
          test -x "$SDK/build-tools/35.0.0/apksigner"
          test -x "$SDK/build-tools/35.0.0/zipalign"

          echo "Android SDK siap."

      - name: Extract source ZIP v82
        shell: bash
        run: |
          set -euo pipefail

          ZIP="UsahoDen-v82-Riwayat-Sticky-Compact-Source.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP sumber v82 tidak ditemukan."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/usaho-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/usaho-source"

          PROJECT=""

          while IFS= read -r file; do
            dir="$(dirname "$file")"

            if [ -f "$dir/app/build.gradle" ] || \
               [ -f "$dir/app/build.gradle.kts" ]; then
              PROJECT="$dir"
              break
            fi
          done < <(
            find "$RUNNER_TEMP/usaho-source" \
              -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \) | sort
          )

          if [ -z "$PROJECT" ]; then
            echo "::error::Proyek Android tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Proyek ditemukan: $PROJECT"

      - name: Fix posisi konten tab Transaksi
        shell: bash
        run: |
          set -euo pipefail

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          if [ ! -f "$HTML" ]; then
            echo "::error::index.html tidak ditemukan."
            exit 1
          fi

          python3 - "$HTML" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          html = path.read_text(encoding="utf-8")
          marker = "usahoden-transaksi-position-fix-v1"

          # Bersihkan skrip patch yang sama jika pernah ditambahkan.
          html = re.sub(
              r'<!-- ' + marker + r' -->.*?<!-- /' + marker + r' -->',
              '',
              html,
              flags=re.S
          )

          script = r"""
          <!-- usahoden-transaksi-position-fix-v1 -->
          <script id="usahoden-transaksi-position-fix-v1">
          (function () {
            'use strict';

            function getContent() {
              return document.getElementById('content')
                || document.querySelector('.content')
                || document.querySelector('main')
                || document.querySelector('.main-content');
            }

            function isTransactionTabActive() {
              var candidates = document.querySelectorAll(
                'nav *, .bottom-nav *, .nav-item, [role="tab"]'
              );

              for (var i = 0; i < candidates.length; i++) {
                var el = candidates[i];
                var active = el.classList.contains('active')
                  || el.classList.contains('selected')
                  || el.classList.contains('current')
                  || el.getAttribute('aria-current') === 'page'
                  || el.getAttribute('aria-selected') === 'true';

                if (!active) continue;

                var label = (
                  el.innerText || el.textContent || ''
                ).replace(/\s+/g, ' ').trim();

                if (/\bTransaksi\b/i.test(label)) {
                  return true;
                }
              }

              return false;
            }

            function applyFix() {
              var content = getContent();
              if (!content) return;

              if (!content.hasAttribute('data-usaho-original-padding')) {
                content.setAttribute(
                  'data-usaho-original-padding',
                  content.style.getPropertyValue('padding-top')
                );
                content.setAttribute(
                  'data-usaho-original-priority',
                  content.style.getPropertyPriority('padding-top')
                );
              }

              if (isTransactionTabActive()) {
                content.style.setProperty(
                  'padding-top',
                  '100px',
                  'important'
                );
              } else if (
                content.style.getPropertyValue('padding-top') === '100px'
              ) {
                var original = content.getAttribute(
                  'data-usaho-original-padding'
                ) || '';
                var priority = content.getAttribute(
                  'data-usaho-original-priority'
                ) || '';

                if (original) {
                  content.style.setProperty(
                    'padding-top',
                    original,
                    priority
                  );
                } else {
                  content.style.removeProperty('padding-top');
                }
              }
            }

            function start() {
              applyFix();

              if (!document.body) return;

              var observer = new MutationObserver(function () {
                applyFix();
              });

              observer.observe(document.body, {
                subtree: true,
                childList: true,
                attributes: true,
                attributeFilter: [
                  'class',
                  'aria-current',
                  'aria-selected'
                ]
              });
            }

            if (document.readyState === 'loading') {
              document.addEventListener(
                'DOMContentLoaded',
                start,
                { once: true }
              );
            } else {
              start();
            }
          })();
          </script>
          <!-- /usahoden-transaksi-position-fix-v1 -->
          """

          # Sisipkan sebelum penutup dokumen jika tersedia.
          # Tidak bergantung pada tag </head> atau </style>.
          body_close = re.search(r"</body\s*>", html, re.I)
          html_close = re.search(r"</html\s*>", html, re.I)

          if body_close:
            pos = body_close.start()
            html = html[:pos] + script + "\n" + html[pos:]
          elif html_close:
            pos = html_close.start()
            html = html[:pos] + script + "\n" + html[pos:]
          else:
            html += "\n" + script + "\n"

          path.write_text(html, encoding="utf-8")

          check = path.read_text(encoding="utf-8")
          if marker not in check:
            raise SystemExit("ERROR: patch tidak ditemukan setelah disimpan.")

          print("Patch posisi tab Transaksi berhasil disisipkan.")
          print("Header tidak diubah.")
          print("Kode login dan data transaksi tidak diubah.")
          PY

      - name: Verify permanent keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD \
                      KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name belum tersedia."
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/usaho-release.jks"

          test -s "$RUNNER_TEMP/usaho-release.jks"

          echo "KEYSTORE_FILE=$RUNNER_TEMP/usaho-release.jks" \
            >> "$GITHUB_ENV"

          echo "Keystore berhasil disiapkan."

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:clean :app:assembleRelease \
              --no-daemon --stacktrace
          else
            gradle :app:clean :app:assembleRelease \
              --no-daemon --stacktrace
          fi

      - name: Sign and verify APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"

          APK="$(find "$APK_DIR" -maxdepth 1 -type f \
            -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK release tidak ditemukan."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          "$TOOLS/zipalign" -f -p 4 \
            "$APK" "$RUNNER_TEMP/usaho-aligned.apk"

          "$TOOLS/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$GITHUB_WORKSPACE/apk-output/UsahoDen.apk" \
            "$RUNNER_TEMP/usaho-aligned.apk"

          "$TOOLS/apksigner" verify --verbose --print-certs \
            "$GITHUB_WORKSPACE/apk-output/UsahoDen.apk"

          test -s "$GITHUB_WORKSPACE/apk-output/UsahoDen.apk"
          echo "APK berhasil ditandatangani dan diverifikasi."

      - name: Upload UsahoDen APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-APK
          path: apk-output/UsahoDen.apk
          if-no-files-found: error
          retention-days: 14
