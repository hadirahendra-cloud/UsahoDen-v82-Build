name: Build UsahoDen v83 Riwayat Scroll FIX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --version
          adb version
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O "$RUNNER_TEMP/gradle-8.7-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.7-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.7/bin/gradle" --version

      - name: Find and extract UsahoDen v83 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 4 -type f \
            -iname 'UsahoDen-v83-Riwayat-Scroll-Source.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::ZIP source v83 tidak ditemukan."
            echo "Pastikan ZIP diunggah ke repository GitHub."
            find . -maxdepth 4 -type f -iname '*.zip' -print || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/usaho-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/usaho-source"

          PROJECT_DIR="$(find "$RUNNER_TEMP/usaho-source" \
            -type f -path '*/app/build.gradle' \
            -print -quit | sed 's#/app/build.gradle$##')"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::app/build.gradle tidak ditemukan dalam ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Source ditemukan di: $PROJECT_DIR"

      - name: Verify application identity
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -s app/build.gradle
          test -s app/src/main/java/com/tokoku/app/MainActivity.java
          test -s app/src/main/assets/index.html

          grep -Fq "applicationId 'com.tokoku.app'" app/build.gradle
          grep -Eq 'versionCode[[:space:]]+83' app/build.gradle

          echo "Identitas aplikasi dan file source utama ditemukan."

      - name: Decode permanent signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ] || \
             [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_ALIAS:-}" ]; then
            echo "::error::Secrets keystore permanen belum lengkap."
            echo "Build dihentikan agar tidak menghasilkan APK dengan tanda tangan berbeda."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/usaho-den-permanent.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/usaho-den-permanent.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          {
            echo "TOKOKU_KEYSTORE_FILE=$RUNNER_TEMP/usaho-den-permanent.jks"
            echo "TOKOKU_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "TOKOKU_KEY_ALIAS=$KEY_ALIAS"
            echo "TOKOKU_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and identity
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" > "$RUNNER_TEMP/badging.txt"

          grep -Fq "package: name='com.tokoku.app'" \
            "$RUNNER_TEMP/badging.txt"

          grep -Fq "versionCode='83'" \
            "$RUNNER_TEMP/badging.txt"

          mkdir -p output
          cp "$APK" \
            output/UsahoDen-v83-Riwayat-Scroll-FIX-Signed.apk

          echo "APK berhasil dibangun dan tanda tangannya terverifikasi."

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v83-Riwayat-Scroll-FIX-Signed
          path: output/UsahoDen-v83-Riwayat-Scroll-FIX-Signed.apk
          if-no-files-found: error
          retention-days: 30