name: Build UsahoDen v82 FIX

on:
  workflow_dispatch:
  push:
    paths:
      - "UsahoDen-v82-Riwayat-Sticky-Compact-Source.zip"
      - ".github/workflows/build-v82.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # FIX: Jangan gunakan input packages multiline.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="UsahoDen-v82-Riwayat-Sticky-Compact-Source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP sumber tidak ditemukan: $ZIP_FILE"
            echo "Pastikan ZIP diunggah ke folder utama repository."
            find . -maxdepth 3 -type f -name "*.zip" -print
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/source"

          PROJECT_DIR=""
          while IFS= read -r file; do
            candidate="$(dirname "$file")"
            if [ -f "$candidate/app/build.gradle" ] || \
               [ -f "$candidate/app/build.gradle.kts" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE/source" \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -type f -print
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Folder proyek Android tidak ditemukan di ZIP."
            find "$GITHUB_WORKSPACE/source" -maxdepth 5 -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \
              -o -name build.gradle -o -name build.gradle.kts \) -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyek ditemukan: $PROJECT_DIR"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          elif command -v gradle >/dev/null 2>&1; then
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          else
            echo "::error::Gradle wrapper maupun Gradle tidak tersedia."
            exit 1
          fi

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          $GRADLE_CMD --version
          $GRADLE_CMD --no-daemon --stacktrace \
            :app:assembleRelease

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$(
            find "$PROJECT_DIR/app/build/outputs/apk/release" \
              -type f -name "*.apk" -print -quit
          )"

          if [ -z "$APK_PATH" ]; then
            echo "::error::APK release tidak ditemukan."
            find "$PROJECT_DIR/app/build/outputs" -type f -print || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/output/UsahoDen-v82-unsigned.apk"
          echo "APK_PATH=$GITHUB_WORKSPACE/output/UsahoDen-v82-unsigned.apk" \
            >> "$GITHUB_ENV"

      - name: Check permanent signing keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$PROJECT_DIR/signing/usaho-den-v61-permanent.jks"

          if [ ! -f "$KEYSTORE" ]; then
            echo "::error::Keystore permanen tidak ditemukan: $KEYSTORE"
            echo "Pastikan file keystore ikut tersedia di source ZIP."
            find "$PROJECT_DIR" -type f \
              \( -name "*.jks" -o -name "*.keystore" \) -print
            exit 1
          fi

          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Sign APK with permanent key
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.USAHODEN_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.USAHODEN_KEY_PASSWORD }}
          KEY_ALIAS: usahoden
        run: |
          set -euo pipefail

          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Secret USAHODEN_KEYSTORE_PASSWORD atau USAHODEN_KEY_PASSWORD belum diatur."
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          "$ZIPALIGN" -f -p 4 "$APK_PATH" \
            "$GITHUB_WORKSPACE/output/UsahoDen-v82-aligned.apk"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$GITHUB_WORKSPACE/output/UsahoDen-v82.apk" \
            "$GITHUB_WORKSPACE/output/UsahoDen-v82-aligned.apk"

          "$APKSIGNER" verify --verbose --print-certs \
            "$GITHUB_WORKSPACE/output/UsahoDen-v82.apk"

      - name: Verify APK application ID
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/output/UsahoDen-v82.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          if [ ! -f "$APK" ]; then
            echo "::error::APK final tidak ditemukan."
            exit 1
          fi

          "$AAPT" dump badging "$APK" | tee "$GITHUB_WORKSPACE/output/apk-info.txt"

          if ! grep -q "package: name='com.tokoku.app'" \
            "$GITHUB_WORKSPACE/output/apk-info.txt"; then
            echo "::error::Application ID bukan com.tokoku.app. Jangan instal APK ini."
            exit 1
          fi

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v82-APK
          path: output/UsahoDen-v82.apk
          if-no-files-found: error
          retention-days: 14