
name: Build UsahoDen v152 - Nama Kiri Kembali Kanan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Temurin 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and extract source ZIP v152
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 5 -type f \
            -iname '*UsahoDen-v152-Riwayat-Nama-Kiri-Kembali-Kanan-Source.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "Source ZIP v152 tidak ditemukan."
            echo "Unggah ZIP v152 ke repository GitHub."
            exit 1
          fi

          mkdir -p tokoku-project
          unzip -q "$ZIP_FILE" -d tokoku-project

          PROJECT_DIR="$(find tokoku-project -type f \
            \( -path '*/app/build.gradle' -o \
               -path '*/app/build.gradle.kts' \) \
            -printf '%h\n' -quit | sed 's#/app$##')"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle modul app tidak ditemukan."
            echo "Periksa isi source ZIP."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "settings.gradle tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyek ditemukan: $PROJECT_DIR"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK - PATOKAN SDK ABANG
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager -print -quit)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          gradle --version
          gradle --no-daemon assembleDebug

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' \
            -path '*/debug/*' -print -quit)"

          if [ -z "$APK" ]; then
            echo "APK debug tidak ditemukan."
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/UsahoDen-v152-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v152-debug
          path: output/UsahoDen-v152-debug.apk
          if-no-files-found: error
