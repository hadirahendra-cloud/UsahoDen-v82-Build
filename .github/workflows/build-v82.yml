
name: Build UsahoDen v142 Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.7/bin/gradle" --version

      - name: Locate source ZIP and extract
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 5 -type f \
            -iname 'UsahoDen-v142-Build-Recovery-Source.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            ZIP="$(find . -maxdepth 5 -type f \
              -iname 'UsahoDen-v139-Pengeluaran-Tanggal-Vertikal-Source.zip' \
              -print -quit)"
          fi

          if [ -z "$ZIP" ]; then
            echo "::error::Source ZIP tidak ditemukan."
            find . -maxdepth 5 -type f -iname '*.zip' -print || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/usaho-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/usaho-source"

          PROJECT_DIR="$(find "$RUNNER_TEMP/usaho-source" \
            -type f -path '*/app/build.gradle' \
            -print -quit | sed 's#/app/build.gradle$##')"

          if [ -z "$PROJECT_DIR" ] || \
             [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "::error::Root proyek Gradle tidak ditemukan."
            find "$RUNNER_TEMP/usaho-source" \
              -maxdepth 5 -type f | head -80
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"

      - name: Prepare existing signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ] || \
             [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_ALIAS:-}" ]; then
            echo "::error::Secret keystore lama belum lengkap."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/usahoden-existing.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          {
            echo "TOKOKU_KEYSTORE_FILE=$KEYSTORE"
            echo "TOKOKU_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "TOKOKU_KEY_ALIAS=$KEY_ALIAS"
            echo "TOKOKU_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Verify identity and build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          grep -Fq "applicationId 'com.tokoku.app'" app/build.gradle
          grep -Eq 'versionCode[[:space:]]+142' app/build.gradle

          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK and prepare artifact
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" | tee "$RUNNER_TEMP/apk-info.txt"

          grep -Fq "package: name='com.tokoku.app'" \
            "$RUNNER_TEMP/apk-info.txt"

          mkdir -p output
          cp "$APK" output/UsahoDen-v142-Build-Recovery.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v142-Build-Recovery-APK
          path: output/UsahoDen-v142-Build-Recovery.apk
          if-no-files-found: error
          retention-days: 14

      - name: Clean temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/usahoden-existing.jks"
