name: Build UsahoDen v159 - Riwayat Transaksi Nama Rumah Makan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java Temurin 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract source ZIP v159
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 6 -type f \
            -iname 'UsahoDen-v159-Riwayat-Transaksi-Nama-Rumah-Makan-Source.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP v159 tidak ditemukan."
            find . -maxdepth 6 -type f -iname '*.zip' -print || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/usaho-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/usaho-source"

          PROJECT_DIR="$(find "$RUNNER_TEMP/usaho-source" \
            -type f -path '*/app/build.gradle' \
            -print -quit | sed 's#/app/build.gradle$##')"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: app/build.gradle tidak ditemukan."
            find "$RUNNER_TEMP/usaho-source" \
              -type f -name 'build.gradle*' -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Source ditemukan: $PROJECT_DIR"

      - name: Install Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="$RUNNER_TEMP/android-sdk"
          TOOLS="$RUNNER_TEMP/android-tools"

          mkdir -p "$TOOLS"

          curl --fail --location --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o "$RUNNER_TEMP/android-tools.zip"

          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$TOOLS"

          mkdir -p "$SDK/cmdline-tools/latest"
          cp -a "$TOOLS/cmdline-tools/." "$SDK/cmdline-tools/latest/"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          set +o pipefail
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true
          set -o pipefail

      - name: Install SDK PATOKAN ABANG
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 \
            "https://services.gradle.org/distributions/gradle-8.7-bin.zip" \
            -o "$RUNNER_TEMP/gradle-8.7.zip"

          unzip -q "$RUNNER_TEMP/gradle-8.7.zip" \
            -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Decode and verify existing signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ] || \
             [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_ALIAS:-}" ] || \
             [ -z "${KEY_PASSWORD:-}" ]; then
            echo "ERROR: Secrets keystore lama belum lengkap."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/usahoden-existing.jks"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          {
            echo "TOKOKU_KEYSTORE_FILE=$KEYSTORE"
            echo "TOKOKU_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "TOKOKU_KEY_ALIAS=$KEY_ALIAS"
            echo "TOKOKU_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Check app identity and versionCode
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if ! grep -Rq 'com\.tokoku\.app' app/build.gradle app/src; then
            echo "ERROR: Identitas com.tokoku.app tidak ditemukan."
            exit 1
          fi

          if ! grep -Eq 'versionCode[[:space:]]+159' app/build.gradle; then
            echo "ERROR: versionCode 159 tidak ditemukan."
            exit 1
          fi

          echo "Pemeriksaan identitas dan versionCode selesai."
          echo "versionName tidak dipaksakan ke format tertentu."

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :app:assembleRelease \
              --no-daemon --stacktrace
          else
            gradle :app:assembleRelease \
              --no-daemon --stacktrace
          fi

      - name: Sign APK with existing keystore
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"
          APK=""

          for FILE in \
            "$APK_DIR/app-release-unsigned.apk" \
            "$APK_DIR/app-release.apk"; do
            if [ -s "$FILE" ]; then
              APK="$FILE"
              break
            fi
          done

          if [ -z "$APK" ]; then
            echo "ERROR: APK Release tidak ditemukan."
            find "$PROJECT_DIR/app/build/outputs" \
              -type f -name '*.apk' -print || true
            exit 1
          fi

          SIGNED_APK="$RUNNER_TEMP/UsahoDen-v159-signed.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$TOKOKU_KEYSTORE_FILE" \
            --ks-key-alias "$TOKOKU_KEY_ALIAS" \
            --ks-pass env:TOKOKU_KEYSTORE_PASSWORD \
            --key-pass env:TOKOKU_KEY_PASSWORD \
            --out "$SIGNED_APK" "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose "$SIGNED_APK"

          mkdir -p output

          cp "$SIGNED_APK" \
            output/UsahoDen-v159-Riwayat-Transaksi-Nama-Rumah-Makan.apk

      - name: Verify APK package and version
        shell: bash
        run: |
          set -euo pipefail

          APK="output/UsahoDen-v159-Riwayat-Transaksi-Nama-Rumah-Makan.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          test -s "$APK"

          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/apk-info.txt"

          grep -Fq "package: name='com.tokoku.app' versionCode='159'" \
            "$RUNNER_TEMP/apk-info.txt" || {
            echo "ERROR: Package atau versionCode APK tidak sesuai."
            exit 1
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v159-Riwayat-Transaksi-Nama-Rumah-Makan
          path: output/UsahoDen-v159-Riwayat-Transaksi-Nama-Rumah-Makan.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup temporary keystore
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/usahoden-existing.jks"
          rm -f "$RUNNER_TEMP/UsahoDen-v159-signed.apk"