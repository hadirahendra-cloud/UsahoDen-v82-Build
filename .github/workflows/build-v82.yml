
name: Build UsahoDen v107 Tombol Keluar Kecil FIX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java Temurin 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::SDK manager tidak ditemukan."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          set +e
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses
          status=${PIPESTATUS[1]}
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::error::Lisensi Android SDK gagal."
            exit 1
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -O "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" \
            -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Find and extract v107 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 6 -type f \
            -iname 'UsahoDen-v107-Tombol-Keluar-Lebih-Kecil-Source.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::ZIP source v107 tidak ditemukan."
            find . -type f -iname '*.zip' -print || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/usaho-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/usaho-source"

          PROJECT_DIR="$(find "$RUNNER_TEMP/usaho-source" \
            -type f -path '*/app/build.gradle' \
            -print -quit | sed 's#/app/build.gradle$##')"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::app/build.gradle tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify v107 source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          grep -Fq "applicationId 'com.tokoku.app'" \
            app/build.gradle

          grep -Eq 'versionCode[[:space:]]+107' \
            app/build.gradle

          grep -Fq \
            "versionName '3.22.15-header-logo-centered-exit-small-v107'" \
            app/build.gradle

          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/header-royal-minang-bg.png

          echo "Pemeriksaan source v107 berhasil."

      - name: Decode existing signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ] || \
             [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_ALIAS:-}" ]; then
            echo "::error::Secrets keystore lama belum lengkap."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/usahoden-existing.jks"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          {
            echo "TOKOKU_KEYSTORE_FILE=$KEYSTORE"
            echo "TOKOKU_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "TOKOKU_KEY_ALIAS=$KEY_ALIAS"
            echo "TOKOKU_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle :app:assembleRelease \
            --no-daemon --stacktrace

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK release tidak ditemukan."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" \
            | tee "$RUNNER_TEMP/apk-info.txt"

          grep -Fq "package: name='com.tokoku.app'" \
            "$RUNNER_TEMP/apk-info.txt"

          grep -Fq "versionCode='107'" \
            "$RUNNER_TEMP/apk-info.txt"

          mkdir -p output

          cp "$APK" \
            output/UsahoDen-v107-Tombol-Keluar-Lebih-Kecil-SIGNED.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v107-Tombol-Keluar-Lebih-Kecil-SIGNED
          path: output/UsahoDen-v107-Tombol-Keluar-Lebih-Kecil-SIGNED.apk
          if-no-files-found: error
          retention-days: 30
