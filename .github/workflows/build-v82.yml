
name: Build UsahoDen v82 - FIX Header Transaksi

on:
  workflow_dispatch:
  push:
    paths:
      - '**.yml'
      - '**.yaml'
      - '*.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK tidak ditemukan."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=""
          for candidate in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK/cmdline-tools/15.0/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" \
              -type f -path '*/bin/sdkmanager' \
              -print -quit 2>/dev/null || true)"
          fi

          if [ ! -d "$SDK/platforms/android-35" ] || \
             [ ! -x "$SDK/build-tools/35.0.0/apksigner" ] || \
             [ ! -x "$SDK/build-tools/35.0.0/zipalign" ]; then

            if [ -z "$SDKMANAGER" ]; then
              echo "::error::sdkmanager tidak ditemukan."
              exit 1
            fi

            yes | "$SDKMANAGER" \
              --sdk_root="$SDK" --licenses \
              >/dev/null 2>&1 || true

            "$SDKMANAGER" --sdk_root="$SDK" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"
          fi

          test -d "$SDK/platforms/android-35"
          test -x "$SDK/build-tools/35.0.0/apksigner"
          test -x "$SDK/build-tools/35.0.0/zipalign"

          echo "Android SDK siap."

      - name: Extract source ZIP v82
        shell: bash
        run: |
          set -euo pipefail

          ZIP="UsahoDen-v82-Riwayat-Sticky-Compact-Source.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP sumber v82 tidak ditemukan."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/usaho-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/usaho-source"

          PROJECT=""

          while IFS= read -r file; do
            dir="$(dirname "$file")"

            if [ -f "$dir/app/build.gradle" ] || \
               [ -f "$dir/app/build.gradle.kts" ]; then
              PROJECT="$dir"
              break
            fi
          done < <(
            find "$RUNNER_TEMP/usaho-source" \
              -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \) | sort
          )

          if [ -z "$PROJECT" ]; then
            echo "::error::Proyek Android tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Sumber: $PROJECT"

      - name: FIX header menimpa pelanggan
        shell: bash
        run: |
          set -euo pipefail

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          if [ ! -f "$HTML" ]; then
            echo "::error::index.html tidak ditemukan."
            exit 1
          fi

          python3 - "$HTML" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          html = path.read_text(encoding="utf-8")

          marker = "usahoden-transaksi-header-flow-fix-v82"

          if marker in html:
              print("Patch header sudah ada.")
              raise SystemExit(0)

          patch = r"""
          <!-- usahoden-transaksi-header-flow-fix-v82 -->
          <style id="usahoden-transaksi-header-flow-fix-v82">
          .usahoden-transaksi-header-flow-fix-v82 {
            position: sticky !important;
            top: 0 !important;
            z-index: 1000 !important;
            margin-top: 0 !important;
            transform: none !important;
          }
          </style>
          <script id="usahoden-transaksi-header-flow-fix-v82-script">
          (function () {
            function fixHeader() {
              try {
                var elements = Array.from(
                  document.querySelectorAll('body *')
                );

                var candidates = elements.filter(function (el) {
                  var text = (el.innerText || el.textContent || '')
                    .replace(/\s+/g, ' ');
                  var rect = el.getBoundingClientRect();
                  var style = getComputedStyle(el);

                  return /UsahoDen/i.test(text) &&
                    /RangMudo\s*Jr/i.test(text) &&
                    rect.width >= window.innerWidth * 0.78 &&
                    rect.height >= 75 &&
                    rect.height <= window.innerHeight * 0.65 &&
                    rect.top < window.innerHeight * 0.4 &&
                    style.display !== 'none' &&
                    style.visibility !== 'hidden';
                });

                if (!candidates.length) return;

                candidates.sort(function (a, b) {
                  return a.getBoundingClientRect().height -
                    b.getBoundingClientRect().height;
                });

                var header = candidates[0];

                header.classList.add(
                  'usahoden-transaksi-header-flow-fix-v82'
                );

                header.style.setProperty(
                  'position', 'sticky', 'important'
                );
                header.style.setProperty('top', '0px', 'important');
                header.style.setProperty('z-index', '1000', 'important');
                header.style.setProperty('margin-top', '0px', 'important');
              } catch (e) {
                console.warn('Header layout fix:', e);
              }
            }

            if (document.readyState === 'loading') {
              document.addEventListener(
                'DOMContentLoaded', fixHeader, { once: true }
              );
            } else {
              fixHeader();
            }

            var attempts = 0;
            var timer = setInterval(function () {
              fixHeader();
              attempts++;
              if (attempts >= 20) clearInterval(timer);
            }, 350);

            if (window.MutationObserver) {
              var observer = new MutationObserver(fixHeader);
              observer.observe(document.documentElement, {
                childList: true,
                subtree: true
              });

              setTimeout(function () {
                observer.disconnect();
              }, 10000);
            }
          })();
          </script>
          """

          match = re.search(r"</body\s*>", html, re.IGNORECASE)

          if match:
              html = html[:match.start()] + patch + html[match.start():]
          else:
              html += patch

          path.write_text(html, encoding="utf-8")
          print("Patch header berhasil ditambahkan.")
          PY

      - name: Verify permanent keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD \
                      KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name belum tersedia."
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/usaho-release.jks"

          test -s "$RUNNER_TEMP/usaho-release.jks"

          echo "KEYSTORE_FILE=$RUNNER_TEMP/usaho-release.jks" \
            >> "$GITHUB_ENV"

          echo "Keystore berhasil disiapkan."

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:clean :app:assembleRelease \
              --no-daemon --stacktrace
          else
            gradle :app:clean :app:assembleRelease \
              --no-daemon --stacktrace
          fi

      - name: Sign and verify APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"

          APK="$(find "$APK_DIR" -maxdepth 1 -type f \
            -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK release tidak ditemukan."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          "$TOOLS/zipalign" -f -p 4 \
            "$APK" "$RUNNER_TEMP/usaho-aligned.apk"

          "$TOOLS/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$GITHUB_WORKSPACE/apk-output/UsahoDen.apk" \
            "$RUNNER_TEMP/usaho-aligned.apk"

          "$TOOLS/apksigner" verify --verbose --print-certs \
            "$GITHUB_WORKSPACE/apk-output/UsahoDen.apk"

          test -s "$GITHUB_WORKSPACE/apk-output/UsahoDen.apk"
          echo "APK berhasil ditandatangani dan diverifikasi."

      - name: Upload UsahoDen APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-APK
          path: apk-output/UsahoDen.apk
          if-no-files-found: error
          retention-days: 14
